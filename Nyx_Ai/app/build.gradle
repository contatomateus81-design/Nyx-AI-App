plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nyxai.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.nyxai.app"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "2.1-native"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
